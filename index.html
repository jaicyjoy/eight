capital"], "items": [["Low productivity", 0], ["Poor quality products", 0], ["Delays", 0], ["Loss of customers and profit", 0], ["Education", 1], ["Vocational training", 1], ["Health care", 1], ["SWAYAM", 1], ["National Career Service", 1]]}], "order": [], "flash": [["Land", "Natural resources like soil and water."], ["Labour", "Human physical and mental effort."], ["Capital", "Man-made tools, machinery, finance used in production."], ["Entrepreneurship", "Ability to organise land, labour and capital and take risk for profit."], ["Human capital", "Skills, knowledge and health → more productivity, quality, innovation, growth."], ["How to build human capital", "Education, vocational training, health care, SWAYAM, National Career Service."], ["No skilled workers →", "Low productivity, poor quality, delays, training costs, loss of customers and profit."]], "summaryAudio": [["eco-s0"], ["eco-s1"], ["eco-s2"], ["eco-s3"], ["eco-s4"], ["eco-s5"], ["eco-s6"]]}], "voice": [["geo-s0", "Resources are anything that has value and can be used to satisfy human needs."], ["geo-s1", "Features of resources: they have utility, they are unevenly distributed, and their development depends on human beings, knowledge, skill and technology."], ["geo-s2", "Nature becomes a resource when its materials are useful and valuable to humans, can be accessed, and are used to satisfy human needs."], ["geo-s3", "Based on use: resources for life (air, water, soil, food), for materials (wood, marble, metals, minerals) and for energy (coal, petroleum, natural gas, sunlight, wind, flowing water)."], ["geo-s4", "Based on renewability: renewable resources are replenished naturally (sunlight, wind, water, forest). Non-renewable resources take millions of years to form (coal, petroleum,"], ["geo-s4_1", "natural gas, minerals, metals)."], ["geo-s5", "Five criteria to categorize resources: use, renewability, origin (biotic, abiotic), status of development (potential, actual, stock, reserve) and distribution (ubiquitous, localized)."], ["geo-s6", "Resources are unevenly distributed because of climate, relief, altitude and geographical structure."], ["geo-s7", "Effects of uneven distribution: rich and poor regions, more industries and jobs in rich areas, dependence on other areas, trade, and conflicts like the Kaveri river issue."], ["geo-s8", "Resource curse: having resources does not make a country rich if they are not used properly, for example without industries, technology and skilled labour."], ["geo-s9", "Sustainable development is the responsible and judicious (wise) use of resources so that they remain available for future generations."], ["geo-s10", "Sustainable practices: use only what is needed, avoid overexploitation and waste, protect resources and biodiversity, recycle and reuse, use renewable energy, and use public transport."], ["geo-s11", "Traditional practices for ecological balance: seasonal fishing bans during the breeding season, and sacred groves protected by religious belief."], ["geo-s12", "Punjab groundwater depletion: water-intensive rice and wheat, plus free electricity for farmers, led to excessive use of tube wells."], ["geo-s13", "Ecosystem functions are natural processes like pollination, decomposition, water purification and climate regulation. They give clean air, fertile soil and agriculture."], ["geo-s14", "Renewable resources replenish naturally and are unlimited if used wisely, like solar energy and forest timber. Non-renewable ones are limited and exhaustible, like coal,"], ["geo-s14_1", "petroleum and minerals."], ["g1-0", "Resources are anything that has value and can be used to satisfy human needs."], ["g1-1", "They have utility."], ["g1-2", "They are unevenly distributed."], ["g1-3", "Their development depends on human beings, knowledge, skill, and technology."], ["g2-0", "When its materials or substances are useful and valuable to humans, and can be accessed and used to satisfy human needs."], ["g3-0", "Natural resources can be categorized in two ways:"], ["g3-1", "Resources essential for life: air, water, soil, food, etc."], ["g3-2", "Resources for materials: wood, marble, metals, and minerals."], ["g3-3", "Resources for energy: coal, petroleum, natural gas, sunlight, wind, flowing water, etc."], ["g3-4", "Renewable resources: resources that can be replenished (reproduced) naturally. E.g., sunlight, wind, water, forest."], ["g3-5", "Non-renewable resources: resources that take millions of years to form and cannot be replaced quickly. E.g., coal, petroleum, natural gas, minerals, and metals."], ["g4-0", "1. Based on use: For life, For material, For energy."], ["g4-1", "2. Based on renewability: Renewable, Non-renewable."], ["g4-2", "3. Based on origin: Biotic, Abiotic."], ["g4-3", "4. Based on status of development: Potential, Actual, Stock, Reserve."], ["g4-4", "5. Based on distribution: Ubiquitous, Localized."], ["g5-0", "Natural resources are unevenly distributed; it is mainly due to climate, relief, altitude, and geographical structure."], ["g5-1", "Some regions are rich in resources, while others are poor."], ["g5-2", "Resource-rich areas develop more industries and create more employment opportunities for local people."], ["g5-3", "Regions with fewer resources depend on other areas for their needs."], ["g5-4", "Trade takes place between regions and countries which are resource-rich."], ["g5-5", "Unequal distribution can lead to competition and conflicts over resources (e.g., Kaveri river issue)."], ["g5-6", "Proper management and conservation became important for sustainable development."], ["g6-0", "Having natural resources does not always make a country rich if the resources are not used properly. Development may remain slow."], ["g6-1", "E.g., a country has coal, petroleum, oil and minerals, but lacks industries, technology, and skilled labour; it cannot progress."], ["g7-0", "Sustainable development is the responsible and judicious (wise) use of resources,"], ["g7-0_1", "which means using resources wisely without wasting them so that they remain available for future generations."], ["g7-1", "Use resources only as much as needed."], ["g7-2", "Avoid overexploitation and wastage of resources."], ["g7-3", "Protect renewable and non-renewable resources."], ["g7-4", "Protect biodiversity."], ["g7-5", "Promote recycling and reuse."], ["g7-6", "Switch to renewable resources of energy for as many purposes as we can."], ["g7-7", "Depend more on public transport than private transport."], ["g8-0", "Seasonal Fishing Bans: Fishing is traditionally avoided during the breeding season. This allows the fish population to regenerate and maintain marine biodiversity."], ["g8-1", "Sacred Groves: Certain forest patches are protected owing to religious belief. This helps conserve biodiversity and protect native plant and animal species."], ["g9-0", "Cultivation of water-intensive crops such as rice and wheat increased the demand for irrigation."], ["g9-1", "Free electricity for farmers also encouraged the excessive use of tube wells for groundwater."], ["g10-0", "Ecosystem functions are natural processes such as pollination, decomposition, water purification, climate regulation, etc."], ["g10-1", "They support human life by enabling clean air, fertile soil, agriculture, and a healthy ecosystem."], ["g11-0", "These are natural resources that regenerate or replenish naturally over time through ecological cycles. Their supply can be maintained if used sustainably. E.g., solar energy,"], ["g11-0_1", "forest timber."], ["g11-1", "Definition. Renewable Resources: Replenish naturally over time. Non-Renewable Resources: Formed over millions of years; limited supply; finite and exhaustible."], ["g11-2", "Availability. Renewable Resources: Unlimited if used wisely. Non-Renewable Resources: Limited supply."], ["g11-3", "Examples. Renewable Resources: Solar energy and forest timber. Non-Renewable Resources: Coal, petroleum, minerals, etc."], ["his-s0", "Babur founded the Mughal Empire in 1526 after defeating Ibrahim Lodi in the First Battle of Panipat, ending the Delhi Sultanate."], ["his-s1", "Babur (1526 to 1530): Turkic-Mongol ruler from Samarkand, descendant of Timur. Brought gunpowder, field artillery and matchlock guns. Wrote the Baburnama. Died in 1530."], ["his-s2", "Humayun (1530 to 1556) died after a fall in 1556."], ["his-s3", "Akbar (1556 to 1605) became emperor at 13. He followed Sulh-i-kul (peace with all), abolished jizya, welcomed Rajputs, made marriage alliances and appointed Hindu officials."], ["his-s4", "Akbar used the Mansabdari system and set up a house of translation at Fatehpur Sikri, where the Mahabharata, Ramayana, Bhagavad Gita and Panchatantra were translated into Persian."], ["his-s5", "Jahangir upheld Islamic authority, tried to expand into the Deccan, and executed Guru Arjan Dev, which led to Sikh resistance."], ["his-s6", "Shahjahan (1628 to 1658) was the architectural pinnacle: he built the Taj Mahal and the Red Fort."], ["his-s7", "Aurangzeb (1658 to 1707) seized the throne from Dara Shikoh, imprisoned Shahjahan, took the title Alamgir, ruled about 49 years and made the empire its largest."], ["his-s8", "Aurangzeb was orthodox: he banned music and dance in court, reintroduced jizya and pilgrimage tax, and persecuted Shias and Sufis."], ["his-s9", "Delhi Sultanate: the Sultan held absolute power. Under the Iqta system, nobles called Iqtadars collected revenue for the army. Posts were not hereditary. Peasants paid the highest tax."], ["his-s10", "Akbar's administration: 12 provinces (Subhas). Diwan for finance, Mir Bakshi for military, Khan-i-Saman for trade, industry, agriculture and household, Sadar for justice,"], ["his-s10_1", "religion and education."], ["his-s11", "Mansabdari system: recorded in Ain-i-Akbari by Abul Fazl. Mansabdars kept troops, elephants, horses and camels, and were paid with land called Jagirs."], ["his-s12", "Todarmal, Akbar's finance minister, made revenue reforms: crop surveys, price standardisation, land measurement and mapping."], ["his-s13", "Non-Muslims were a minority in top posts, and Muslims of foreign origin were often favoured over Indian Muslims."], ["his-s14", "People's lives: rich agriculture, trade through ports like Calicut, Surat, Masulipatnam and Hooghly, Marwari credit trade and the Hundi system."], ["his-s15", "Problems: by the late 1600s peasants faced high taxes and became bonded labourers, wealth stayed with rulers and merchants, and wars displaced people. Still,"], ["his-s15_1", "India stayed prosperous and culturally vibrant."], ["h1-0", "The Mughal Empire was founded in 1526 by Babur after he defeated Ibrahim Lodi in the First Battle of Panipat, thus ending the reign of the Delhi Sultanate."], ["h2-0", "Babur was a Turkic-Mongol ruler from Samarkand, and he was a descendant of Timur and became the first ruler of the Mughal Empire."], ["h2-1", "He introduced gun powder, field artillery and matchlock guns. Those were first used in India in the First Battle of Panipat."], ["h2-2", "He authored the Baburnama (autobiography of Babur), showing his refined interests in poetry, architecture, gardens and fauna."], ["h2-3", "Known for ruthless conquest strategy including creating \"towers of skulls\" from defeated forces."], ["h2-4", "Babur died in 1530."], ["h3-0", "Humayun died after a fall in 1556."], ["h4-0", "Humayun's accidental death in 1556 AD resulted in his son Akbar becoming emperor at a very young age of 13, through the victory at Panipat."], ["h4-1", "He expanded the empire through conquests and smart alliances and established a strong and lasting Mughal rule in India."], ["h4-2", "He instituted Sulh-i-kul (Peace with all), abolished the jizya tax, and welcomed Rajputs into his court."], ["h4-3", "He entered into marriage alliances with princesses of neighbouring kingdoms and even appointed Hindu officials to high posts. Therefore,"], ["h4-3_1", "he blended administrative cohesion and religious harmony."], ["h4-4", "Used the Mansabdari system to organise bureaucracy with ranks tied to military service."], ["h4-5", "Although illiterate, he still had great interest in Persian and Indian texts."], ["h4-6", "He established a house of translation at Fatehpur Sikri where he commissioned the translation of Sanskrit texts: Mahabharata, Ramayana, Bhagavad Gita, and the Panchatantra into Persian."], ["h4-7", "Akbar was known for his liberal approach and religious tolerance."], ["h4-8", "Akbar died in 1605."], ["h5-0", "Jahangir upheld Islamic authority and tried to expand into the Deccan."], ["h5-1", "He patronised religion but also faced friction, most notably after executing Guru Arjan Dev, which led to Sikh resistance."], ["h6-0", "Shahjahan marked the architectural pinnacle of the Empire."], ["h6-1", "He built architectural marvels like the Taj Mahal and Red Fort."], ["h6-2", "Fought rebellions to consolidate his rule."], ["h7-0", "Aurangzeb seized the throne from his elder brother Dara Shikoh in 1658 and even imprisoned his father Shahjahan until his death."], ["h7-1", "He gave himself the title of \"Alamgir\" and ruled for approximately 49 years."], ["h7-2", "He conducted many campaigns and brought the Mughal Empire to its greatest territorial extent."], ["h7-3", "He was an orthodox ruler. He banned bands, dance, and music in his court, labeling them un-Islamic."], ["h7-4", "He reintroduced Jizya tax on non-Muslims and Pilgrimage tax on Hindus."], ["h7-5", "This aspect of Aurangzeb was also visible in his persecution of Muslims of other sects, including Shias and Sufis."], ["h7-6", "Aurangzeb died in 1707."], ["h8-0", "There was central authority and the Sultan held absolute power, both political and military."], ["h8-1", "Key responsibilities included defending Islamic territories, tax collection, and monitoring public welfare."], ["h8-2", "Council of ministers managed the various departments of government, alongside governors."], ["h9-0", "Land or Iqta was assigned to nobles (Iqtadars) to collect revenues for the army; the rest went to the Sultan's treasury."], ["h9-1", "Posts were not hereditary; hence, while maintaining central control, the system created local loyalty to the Sultan."], ["h9-2", "Peasants were burdened with the highest tax, with frequent cruelty reported in revenue collections."], ["h10-0", "Akbar restructured the administration for efficiency and control; divided into 12 Provinces (Subhas)."], ["h10-1", "Diwan: Managed finances and revenue."], ["h10-2", "Mir Bakshi: In charge of military affairs."], ["h10-3", "Khan-i-Saman: Supervised trade, industry, agriculture, royal household."], ["h10-4", "Sadar: Handled justice, religion and education."], ["h10-5", "Each of the 12 provinces had all such ministers."], ["h10-6", "While maintaining checks and balances among officials, Subhas were further divided under official control."], ["h10-7", "At the village level, traditional self-governance remained intact."], ["h11-0", "Introduced by Akbar, recorded in Ain-i-Akbari by Abul Fazl."], ["h11-1", "Mansabdars (ranked officers) had to maintain a specified number of troops, elephants, horses, camels."], ["h11-2", "This enabled the maintenance of a flexible and quick army without permanent costs."], ["h11-3", "Mansabdars were paid with land (Jagirs)."], ["h11-4", "Regular inspections ensured loyalty and complaints."], ["h12-0", "Todarmal was Akbar's finance minister. He introduced an efficient revenue system: crop yield surveys, price standardisation for different crops, systematic land measurement,"], ["h12-0_1", "and mapping across the Empire."], ["h12-1", "These reforms made tax collection more efficient and strengthened state control."], ["h13-0", "Despite Akbar's practical, tolerant policies, non-Muslims were a minority in top posts."], ["h13-1", "Muslims of foreign origin were often favoured over Indian Muslims."], ["h14-0", "India had a strong agricultural economy and was one of the wealthiest regions in the world."], ["h14-1", "Roads, bridges, canals, and irrigation works expanded during the Sultanate and Mughal periods."], ["h14-2", "Agriculture improved due to irrigation systems and the cultivation of multiple crops such as sugarcane, rice, wheat, barley, cotton, and spices."], ["h14-3", "Textiles, shipbuilding, handicrafts, jewellery, and metal works developed greatly."], ["h14-4", "India had extensive internal and overseas trade through ports like Calicut, Surat, Masulipatnam, or Hooghly."], ["h14-5", "Merchant communities like the Marwaris developed a system of credit trade."], ["h14-6", "The Hundi system helped merchants transfer money without carrying cash."], ["h15-0", "By the late 1600s, many peasants suffered from high taxes, lost their land, and became bonded labourers."], ["h15-1", "Wealth was mainly concentrated in the hands of the rulers, courtiers, high officials, and the merchants."], ["h15-2", "Frequent warfare caused forced displacements of people and economic hardship."], ["h15-3", "Despite some conflicts, people of different religious communities generally lived peacefully together and depended on one another."], ["h15-4", "Though politically unstable, India remained economically prosperous and culturally vibrant."], ["eco-s0", "There are four factors of production: land, labour, capital and entrepreneurship."], ["eco-s1", "Land means natural resources like soil and water. Labour is human physical and mental effort."], ["eco-s2", "Capital means man-made tools, machinery and finance used in production. Entrepreneurship is the ability to organise the other three and take risks for profit."], ["eco-s3", "Entrepreneurs bring together land, labour and capital. Skilled labour (human capital) increases efficiency, and capital goods support labour."], ["eco-s4", "Human capital includes skills, knowledge and health. It raises productivity and quality, supports innovation and leads to economic growth."], ["eco-s5", "Human capital is built through education, vocational training, health care, and platforms like SWAYAM and National Career Service."], ["eco-s6", "Without skilled workers, businesses face low productivity, poor quality, delays, higher training costs, and loss of customers and profit."], ["e1-0", "The factors of production include:"], ["e1-1", "Land: Natural resource like soil and water."], ["e1-2", "Labour: Human physical and mental effort."], ["e1-3", "Capital: Man-made tools, machinery, finance used in production."], ["e1-4", "Entrepreneurship: The ability to organise the other three and take risk for profit."], ["e2-0", "Entrepreneurs bring together land, labour, and capital to produce goods."], ["e2-1", "Skilled labour (human capital) increases worker efficiency, and capital goods support labour."], ["e3-0", "Human capital includes skills, knowledge, and health, which enhances productivity."], ["e3-1", "These factors help in increasing efficiency and output quality, supporting innovation, leading to economic growth."], ["e3-2", "It is built through education and vocational training, health care, and platforms like SWAYAM and National Career Service."], ["e4-0", "When businesses cannot find skilled workers, they face:"], ["e4-1", "Low productivity."], ["e4-2", "Poor quality products or services."], ["e4-3", "Delays, increased training costs, loss of customers and profit."], ["e4-4", "Skilled workers are essential for business growth and competition."]]}</script>
<script>
const D = JSON.parse(document.getElementById('data').textContent);
const TXT = Object.fromEntries(D.voice);
const CH = Object.fromEntries(D.chapters.map(c => [c.id, c]));
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const load = k => new Set(JSON.parse(localStorage.getItem(k) || '[]'));
const readSet = load('ss8-read'), okSet = load('ss8-ok');
const save = () => { localStorage.setItem('ss8-read', JSON.stringify([...readSet])); localStorage.setItem('ss8-ok', JSON.stringify([...okSet])); };
let slow = localStorage.getItem('ss8-slow') === '1';

const qsOf = (c, tid) => c.quiz.filter(q => q.topic === tid);
const mastered = (c, tid) => qsOf(c, tid).every(q => okSet.has(q.id));
function starsOf(c) {
  let got = 0;
  c.topics.forEach(t => { if (readSet.has(t.id)) got++; if (mastered(c, t.id)) got++; });
  return {got, total: c.topics.length * 2};
}
function allStars() {
  return D.chapters.reduce((s, c) => { const x = starsOf(c); return {got: s.got + x.got, total: s.total + x.total}; }, {got: 0, total: 0});
}

const sp = new Audio();
let ptok = 0, cur = null;
const rate = () => slow ? 0.75 : 1;
function clearOn() {
  document.querySelectorAll('.ln.on').forEach(e => e.classList.remove('on'));

function stopAll() { ptok++; sp.pause(); clearOn(); cur = null; }
function playClip(id, mine, text) {
  return new Promise(res => {
    if (mine !== ptok) return res(false);
    let remote = false;
    sp.onended = () => res(mine === ptok);
    sp.onerror = () => {
      if (mine !== ptok) return res(false);
      const t = text || TXT[id];
      if (!remote && t) {
        remote = true;
        sp.src = 'https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl=en-IN&q=' + encodeURIComponent(t.slice(0, 190));
        sp.defaultPlaybackRate = sp.playbackRate = rate();
        sp.play().catch(() => {});
      } else res(false);
    };
    sp.src = id ? 'voice/' + id + '.mp3' : 'about:blank';
    sp.defaultPlaybackRate = sp.playbackRate = rate();
    sp.play().catch(e => { if (e.name === 'NotAllowedError') res(false); });
  });
}
async function playLines(els, after) {
  stopAll();
  const mine = ptok;
  for (const el of els) {
    if (mine !== ptok) return;
    clearOn();
    el.classList.add('on');
    const b = el.querySelector('.mini');
    if (b) b.textContent = '⏸';
    cur = {el, paused: false};
    el.scrollIntoView({block: 'nearest', behavior: 'smooth'});
    for (const id of el.dataset.a.split(',')) {
      if (!(await playClip(id, mine))) return;
    }
  }
  if (mine === ptok) { stopAll(); if (after) after(); }
}

let actx = null;
function tone(fs, d, type, v) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = actx.currentTime;
    fs.forEach((f, k) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + k * d);
      g.gain.exponentialRampToValueAtTime(v, t0 + k * d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + (k + 1) * d);
      o.connect(g); g.connect(actx.destination);
      o.start(t0 + k * d); o.stop(t0 + (k + 1) * d + 0.05);
    });
  } catch (e) {}
}
const ding = () => tone([660, 880, 1175], 0.1, 'sine', 0.3);
const buzz = () => tone([220, 165], 0.16, 'triangle', 0.3);
function confetti() {
  const em = ['⭐', '🎉', '✨', '🌟', '🎈', '💜'];
  for (let i = 0; i < 20; i++) {
    const s = document.createElement('span');
    s.className = 'conf'; s.textContent = em[i % em.length];
    s.style.left = Math.random() * 100 + 'vw'; s.style.animationDelay = Math.random() * 0.4 + 's';
    document.body.appendChild(s); setTimeout(() => s.remove(), 2200);
  }
}

function startChallenge(o) {

const TYPE = {mcq: ['Choose the answer', '#4361ee'], tf: ['True or False', '#06a77d'], fill: ['Fill in the blank', '#7b2cbf']};
function showQ() {
  if (!G.queue.length || (G.mode === 'challenge' && G.lives <= 0)) return quizEnd();
  const q = G.queue[0];
  G.cur = q; G.opts = q.type === 'tf' ? q.opts : shuffle(q.opts); G.answered = false;
  const done = G.mode === 'practice' ? G.learned.size : G.total - G.queue.length;
  setScore(G.mode === 'practice' ? `⭐ ${G.learned.size}/${G.total}` : `<span class="lives">${'❤️'.repeat(G.lives)}${'🤍'.repeat(3 - G.lives)}</span> · ${G.score}`);
  const qhtml = esc(q.q).replace(/_{3,}/g, '<span class="blank">&nbsp;</span>');
  ovb().innerHTML = `
    <div class="qprog"><div class="bar"><i style="width:${done / G.total * 100}%"></i></div><span>${G.mode === 'practice' ? `${G.learned.size}/${G.total} learned` : `Q ${done + 1}/${G.total} · 🔥 ${G.streak}`}</span></div>
    <div class="qc">
      <span class="badge" style="--bb:${TYPE[q.type][1]}">${TYPE[q.type][0]}</span> <span class="badge" style="--bb:${q.c.c1}">${q.c.emoji} ${q.c.subject}</span>
      <div class="qq"><span>${qhtml}</span><button class="say" onclick="sayText(G.cur.q)">🔊</button></div>
      <div class="opts">${G.opts.map((o, k) => `<button class="opt" onclick="answer(this,${k})">${esc(o)}</button>`).join('')}</div>
      <div id="after"></div>
    </div>`;
  ovb().scrollTop = 0;
}
function answer(btn, k) {
  if (G.answered) return;
  G.answered = true;
  const q = G.queue.shift(), btns = [...document.querySelectorAll('.opt')];
  btns.forEach(b => b.disabled = true);
  const ok = G.opts[k] === q.a;
  let note;
  if (ok) {
    btn.classList.add('ok');
    okSet.add(q.id); save();
    ding(); confetti();
    if (G.mode === 'practice') { G.learned.add(q.id); if (!G.missed.has(q.id)) G.first++; }
    else { G.score++; G.streak++; G.bestStreak = Math.max(G.bestStreak, G.streak); }
    note = `<div class="note good">${['Well done! 🎉', 'Super! 🌟', 'Correct! 💯', 'Brilliant! ✨'][Math.floor(Math.random() * 4)]}</div>`;
  } else {
    btn.classList.add('bad');
    btns.forEach((b, j) => { if (G.opts[j] === q.a) b.classList.add('ok'); });
    G.missed.set(q.id, {q: q.q, a: q.a});
    buzz();
    if (G.mode === 'practice') {
      G.queue.splice(Math.min(G.queue.length, 3 + Math.floor(Math.random() * 3)), 0, q);
      note = `<div class="note bad">The right answer is in green. This question will come back soon 🔁</div>`;
    } else {
      G.lives--; G.streak = 0;
      note = `<div class="note bad">Oops! You lost a life 💔 The right answer is in green.</div>`;
    }
  }
  setScore(G.mode === 'practice' ? `⭐ ${G.learned.size}/${G.total}` : `<span class="lives">${'❤️'.repeat(Math.max(0, G.lives))}${'🤍'.repeat(3 - Math.max(0, G.lives))}</span> · ${G.score}`);
  document.getElementById('after').innerHTML = note + `<button class="nx" onclick="showQ()">Next ➜</button>`;
}
function quizEnd() {
  const review = [...G.missed.values()];
  let big, msg, line, stars;
  if (G.mode === 'practice') {
    const s = G.first, n = G.total;
    stars = Math.max(1, Math.round(s / n * 5));
    big = s === n ? '🏆' : s >= n * 0.7 ? '🥳' : '💪';
    msg = s === n ? 'Perfect! All correct the first time!' : 'Great! Now you know all of them!';
    line = `${s} of ${n} correct on the first try`;
  } else {
    const key = 'ss8-best-' + (G.o.all ? 'all' : G.o.ch);
    const best = Math.max(+(localStorage.getItem(key) || 0), G.score);
    localStorage.setItem(key, best);
    stars = Math.max(1, Math.round(G.score / G.total * 5));
    big = G.lives > 0 ? '🏆' : '💥';
    msg = G.lives > 0 ? 'You finished with lives left!' : 'Game over! Try to beat your score.';
    line = `Score: ${G.score} · Best streak: 🔥 ${G.bestStreak} · Best score: ${best}`;
  }
  ovb().innerHTML = `<div class="end"><div class="bigem">${big}</div><h2>${msg}</h2><p style="font-size:17px">${line}</p>
    <div class="stars">${'⭐'.repeat(stars)}${'☆'.repeat(5 - stars)}</div>
    ${review.length ? `<div class="review"><h3>Read these once more:</h3>${review.map(r => `<div>${esc(r.q)}<br><b>✔ ${esc(r.a)}</b></div>`).join('')}</div>` : ''}
    <div class="row2"><button class="nx" onclick="${G.mode === 'practice' ? 'startQuiz' : 'startChallenge'}(G.o)">🔁 Play again</button><button class="nx alt" onclick="closeOv()">✕ Close</button></div></div>`;
  confetti(); ding();
}

function startMatch(cid, mi) {
  const c = CH[cid], m = c.match[mi];
  const pairs = shuffle(m.pairs.map((p, i) => ({l: p[0], r: p[1], i})));
  const nr = Math.ceil(pairs.length / 5), size = Math.ceil(pairs.length / nr), rounds = [];
  for (let k = 0; k < pairs.length; k += size) rounds.push(pairs.slice(k, k + size));
  G = {mode: 'match', c, cid, mi, m, rounds, r: 0, mistakes: 0};
  openOv('🔗 ' + m.title, c);
  showMatch();
}
function showMatch() {
  const R = G.rounds[G.r];
  G.done = 0; G.sel = null;
  setScore(`Round ${G.r + 1}/${G.rounds.length}`);
  ovb().innerHTML = `<p class="mh">Tap one on the left, then its partner on the right 👆</p><div class="mcols">
    <div class="mcol"><h4>${esc(G.m.left)}</h4>${shuffle(R).map(p => `<button class="mb" data-i="${p.i}" onclick="pickL(this)">${esc(p.l)}</button>`).join('')}</div>
    <div class="mcol"><h4>${esc(G.m.right)}</h4>${shuffle(R).map(p => `<button class="mb" data-i="${p.i}" onclick="pickR(this)">${esc(p.r)}</button>`).join('')}</div></div>`;
}
function pickL(b) {
  if (b.classList.contains('done')) return;
  document.querySelectorAll('.mcol:first-child .mb').forEach(x => x.classList.remove('sel'));
  b.classList.add('sel'); G.sel = b;
}
function pickR(b) {
  if (b.classList.contains('done')) return;
  if (!G.sel) { b.classList.add('bad'); setTimeout(() => b.classList.remove('bad'), 400); return; }
  if (b.dataset.i === G.sel.dataset.i) {
    [b, G.sel].forEach(x => { x.classList.remove('sel'); x.classList.add('done'); });
    G.sel = null; G.done++; ding();
    if (G.done === G.rounds[G.r].length) setTimeout(matchEnd, 500);
  } else {
    const s = G.sel; [b, s].forEach(x => x.classList.add('bad'));
    setTimeout(() => { b.classList.remove('bad'); s.classList.remove('bad'); }, 400);
    G.mistakes++; buzz();
  }
}
function matchEnd() {
  const last = G.r + 1 >= G.rounds.length;
  confetti();
  ovb().innerHTML = `<div class="end"><div class="bigem">${last ? '🏆' : '🎉'}</div><h2>${last ? 'All pairs matched!' : 'Round complete!'}</h2>
    ${last ? `<p>Mistakes: <b>${G.mistakes}</b>${G.mistakes ? '' : ' 💯'}</p>` : ''}
    <div class="row2">${last ? `<button class="nx" onclick="startMatch(G.cid,G.mi)">🔁 Play again</button>` : `<button class="nx" onclick="G.r++;showMatch()">Next round ➜</button>`}
    <button class="nx alt" onclick="closeOv()">✕ Close</button></div></div>`;
}

function startSort(cid, si) {
  const c = CH[cid], s = c.sort[si];
  G = {mode: 'sort', c, cid, si, s, left: shuffle(s.items.map((it, i) => i)), placed: s.buckets.map(() => []), sel: null, mistakes: 0};
  openOv('🧺 ' + s.title, c);
  showSort();
}
function showSort() {
  const s = G.s;
  setScore(`${s.items.length - G.left.length}/${s.items.length}`);
  if (!G.left.length) {
    confetti(); ding();
    ovb().innerHTML = `<div class="end"><div class="bigem">🏆</div><h2>Everything sorted!</h2><p>Mistakes: <b>${G.mistakes}</b>${G.mistakes ? '' : ' 💯'}</p>
      <div class="row2"><button class="nx" onclick="startSort(G.cid,G.si)">🔁 Play again</button><button class="nx alt" onclick="closeOv()">✕ Close</button></div></div>`;
    return;
  }
  ovb().innerHTML = `<p class="mh">Tap an item, then tap the group it belongs to 👇</p>
    <div class="pool">${G.left.map(i => `<button class="chipb ${G.sel === i ? 'sel' : ''}" data-i="${i}" onclick="G.sel=${i};showSort()">${esc(s.items[i][0])}</button>`).join('')}</div>
    <div class="buckets">${s.buckets.map((b, k) => `<div class="bucket" onclick="dropTo(${k},this)"><h4>${esc(b)}</h4>${G.placed[k].map(i => `<div>${esc(s.items[i][0])}</div>`).join('')}</div>`).join('')}</div>`;
}
function dropTo(k, el) {
  if (G.sel === null) return;
  const i = G.sel;
  if (G.s.items[i][1] === k) {
    G.placed[k].push(i); G.left = G.left.filter(x => x !== i); G.sel = null; ding(); showSort();
  } else {
    G.mistakes++; buzz();
    const chip = document.querySelector(`.chipb[data-i="${i}"]`);
    if (chip) { chip.classList.add('bad'); setTimeout(() => chip.classList.remove('bad'), 400); }
  }
}

function startOrder(cid, oi) {
  const c = CH[cid], o = c.order[oi];
  G = {mode: 'order', c, cid, oi, o, picked: 0, shuf: shuffle(o.items.map((_, i) => i)), mistakes: 0};
  openOv('🔢 ' + o.title, c);
  setScore('');
  ovb().innerHTML = `<div class="qc"><div class="qq"><span>Tap them in the correct order: first one first!</span></div>
    <div class="oans" id="oans"></div>
    <div class="oleft">${G.shuf.map(i => `<button class="opt" data-i="${i}" onclick="pickO(this)">${esc(o.items[i])}</button>`).join('')}</div><div id="after"></div></div>`;
}
function pickO(b) {
  if (+b.dataset.i === G.picked) {
    G.picked++;
    document.getElementById('oans').insertAdjacentHTML('beforeend', `<div>${G.picked}. ${esc(G.o.items[+b.dataset.i])}</div>`);
    b.remove(); ding();
    if (G.picked === G.o.items.length) {
      confetti();
      document.getElementById('after').innerHTML = `<div class="note good">Perfect order! 🎉 Mistakes: ${G.mistakes}</div>
        <div class="row2"><button class="nx" onclick="startOrder(G.cid,G.oi)">🔁 Play again</button><button class="nx alt" onclick="closeOv()">✕ Close</button></div>`;
    }
  } else {
    b.classList.add('bad'); setTimeout(() => b.classList.remove('bad'), 400); G.mistakes++; buzz();
  }
}

render();
</script>
</body>
</html>
