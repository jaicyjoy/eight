<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Class 8 Social Science – Learn & Play</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Avenir Next","Segoe UI","Roboto",system-ui,sans-serif;color:#1f2340;background:linear-gradient(180deg,#e0f2ff 0%,#f6efff 50%,#fff6e8 100%);min-height:100vh;line-height:1.5}
button{font-family:inherit;color:inherit;cursor:pointer}
#app{max-width:900px;margin:0 auto;padding:12px 14px 70px}

.hero{text-align:center;padding:18px 8px 6px}
.hero .big{font-size:58px;display:inline-block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-5deg)}}
.hero h1{margin:4px 0 0;font-size:32px;background:linear-gradient(90deg,#4361ee,#b5179e,#f77f00);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:2px 0 0;color:#5b5f86;font-size:17px}
.tracker{background:#fff;border-radius:22px;padding:14px 16px;margin:14px 0;box-shadow:0 6px 0 #e3e0f7}
.tracker .row{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:18px}
.bar{height:16px;background:#ece9fb;border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#ffd60a,#06d6a0);transition:width .5s}
.tracker small{display:block;color:#6b6f93;margin-top:6px;font-size:14px}

.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ccard{border:0;border-radius:24px;padding:16px;text-align:left;color:#fff;background:linear-gradient(140deg,var(--c1),var(--c2));box-shadow:0 7px 0 rgba(0,0,0,.15);transition:transform .12s}
.ccard:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(0,0,0,.15)}
.ccard .sub{font-size:14px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;opacity:.9}
.ccard .em{font-size:48px;float:right;line-height:1}
.ccard h2{margin:4px 0 10px;font-size:22px;line-height:1.25}
.ccard .bar{background:rgba(255,255,255,.3)}
.ccard .st{font-weight:700;font-size:14px;margin-top:6px}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-top:14px}
.qbtn{border:0;border-radius:20px;padding:14px;text-align:left;font-weight:800;font-size:17px;color:#fff;background:var(--b);box-shadow:0 6px 0 rgba(0,0,0,.15)}
.qbtn small{display:block;font-weight:600;font-size:13px;opacity:.95}
.foot{text-align:center;margin-top:26px;font-size:14px;color:#6b6f93}
.foot a{color:#4361ee}

.top{position:sticky;top:6px;z-index:10;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:22px;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 6px 0 rgba(0,0,0,.12)}
.top .home{border:0;background:#fff;width:44px;height:44px;border-radius:50%;font-size:20px;flex:none}
.top .tt{flex:1;min-width:0}
.top .tt small{display:block;font-size:13px;font-weight:700;opacity:.9;text-transform:uppercase;letter-spacing:.4px}
.top .tt b{display:block;font-size:19px;line-height:1.2}
.chip{background:rgba(255,255,255,.25);border-radius:99px;padding:4px 10px;font-weight:800;font-size:14px;white-space:nowrap}
.slowbtn{border:0;border-radius:99px;padding:7px 10px;font-weight:800;font-size:14px;background:rgba(255,255,255,.25);color:#fff;white-space:nowrap}
.slowbtn.on{background:#ffd60a;color:#3a2b00}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.tab{border:0;border-radius:16px;padding:11px 4px;font-weight:800;font-size:15px;background:#fff;box-shadow:0 5px 0 #dedbf3}
.tab.on{background:var(--c1);color:#fff;box-shadow:0 5px 0 var(--c2)}

.tools{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 12px}
.pill{border:0;border-radius:99px;padding:10px 18px;font-weight:800;font-size:15px;color:#fff;background:var(--c1);box-shadow:0 4px 0 var(--c2)}
.pill.alt{background:#fff;color:#1f2340;box-shadow:0 4px 0 #dedbf3}

.scard{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:18px;padding:12px;margin-bottom:10px;box-shadow:0 4px 0 #e6e3f7;border-left:6px solid var(--c1)}
.num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--c1);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:14px;margin-top:3px}
.ln.on{background:#fff6cc}
.scard.ln.on{background:#fff6cc}
.mini{flex:none;width:36px;height:36px;border-radius:50%;border:2px solid #e3e0f7;background:#fff;font-size:14px;margin-top:1px}
.ln.on .mini{background:#ffb703;border-color:#f48c06;color:#fff}
.scard span.tx{flex:1;font-size:17px}

.topic{background:#fff;border-radius:22px;padding:14px;margin-bottom:16px;box-shadow:0 6px 0 #e6e3f7;border-top:6px solid var(--c1)}
.topic.done{border-top-color:#06d6a0}
.th{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.th h3{margin:0;font-size:19px;line-height:1.3;color:var(--c2)}
.tstars{display:flex;gap:6px;flex:none}
.tstars span{background:#f4f2ff;border-radius:99px;padding:3px 8px;font-size:14px;font-weight:700;white-space:nowrap}
.topic h4{margin:12px 0 4px;font-size:16px;color:#4a4f7a}
.topic .ln{display:flex;gap:8px;align-items:flex-start;padding:6px;border-radius:12px}
.topic .ln span.tx{flex:1;font-size:16.5px}
.topic .ln.li span.tx::before{content:"•";color:var(--c1);font-weight:900;margin-right:6px}
.topic table{width:100%;border-collapse:collapse;margin:8px 0;font-size:15px}
.topic th{background:var(--c1);color:#fff;text-align:left;padding:8px}
.topic td{padding:8px;border-bottom:1px solid #eee;vertical-align:top}
.topic tr.ln td:first-child{white-space:nowrap}
.topic tr.ln td:first-child .mini{margin-right:6px;vertical-align:middle}
.tbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tbtns button{border:0;border-radius:99px;padding:9px 14px;font-weight:800;font-size:14px;background:#f1efff;box-shadow:0 3px 0 #dedbf3}
.tbtns button.read{background:#06d6a0;color:#fff;box-shadow:0 3px 0 #04a57b}
b.k{color:var(--c2)}

.gtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.gt{border:0;border-radius:20px;padding:14px;text-align:left;color:#fff;background:var(--b);box-shadow:0 6px 0 rgba(0,0,0,.18)}
.gt .i{font-size:30px;display:block}
.gt b{display:block;font-size:17px;line-height:1.25}
.gt small{display:block;font-size:13px;opacity:.95;margin-top:2px}
.ghead{font-weight:800;color:#4a4f7a;margin:16px 2px 8px;font-size:16px}

.check{background:#fff;border-radius:16px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:center;box-shadow:0 3px 0 #e6e3f7}
.check .ct{flex:1;font-weight:700;font-size:15px}
.check .ct small{display:block;color:#6b6f93;font-weight:600}
.check .s{font-size:20px}
.check button{border:0;border-radius:99px;padding:7px 12px;font-weight:800;font-size:13px;background:#f1efff}

.ov{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;background:linear-gradient(160deg,#eef0ff,#fff0f7 55%,#fff8e6)}
.ov.show{display:flex}
.ovtop{display:flex;align-items:center;gap:10px;padding:12px 14px;color:#fff;background:linear-gradient(135deg,var(--c1,#4361ee),var(--c2,#b5179e))}
.ovtop button{border:0;background:#fff;width:42px;height:42px;border-radius:50%;font-size:18px;font-weight:900;color:#333;flex:none}
.ovtop .t{flex:1;font-weight:800;font-size:17px}
.ovtop .sc{background:rgba(255,255,255,.25);border-radius:99px;padding:4px 12px;font-weight:800;white-space:nowrap}
.ovb{flex:1;overflow-y:auto;padding:16px 14px 40px;max-width:820px;width:100%;margin:0 auto}
.qprog{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-weight:800;color:#4a4f7a;font-size:14px}
.qprog .bar{flex:1;margin:0}
.qc{background:#fff;border-radius:22px;padding:16px;box-shadow:0 7px 0 #e6e3f7}
.badge{display:inline-block;border-radius:99px;padding:3px 12px;color:#fff;font-size:13px;font-weight:800;background:var(--bb,#4361ee)}
.qq{display:flex;gap:10px;align-items:flex-start;margin-top:10px;font-size:20px;font-weight:800;line-height:1.45}
.qq span{flex:1}
.blank{display:inline-block;min-width:70px;border-bottom:3px solid #7b2cbf;margin:0 4px}
.say{border:0;background:#efeaff;border-radius:50%;width:42px;height:42px;font-size:17px;flex:none}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{border:2px solid #e3e0f7;background:#f8f7ff;border-radius:16px;padding:12px 14px;font-size:17px;text-align:left;line-height:1.4;box-shadow:0 4px 0 #e3e0f7}
.opt.ok{background:#c9f7d6;border-color:#2fbf71;box-shadow:0 4px 0 #2fbf71;animation:pop .35s}
.opt.bad{background:#ffd3d3;border-color:#e5484d;box-shadow:0 4px 0 #e5484d;animation:shake .35s}
.opt:disabled{cursor:default}
@keyframes pop{50%{transform:scale(1.03)}}
@keyframes shake{25%,75%{transform:translateX(-7px)}50%{transform:translateX(7px)}}
.note{margin-top:12px;font-weight:800;text-align:center}
.note.good{color:#1f9d55}.note.bad{color:#d9480f}
.nx{display:block;margin:14px auto 0;border:0;border-radius:99px;padding:12px 34px;font-size:17px;font-weight:800;color:#fff;background:linear-gradient(135deg,#4361ee,#b5179e);box-shadow:0 5px 0 rgba(67,97,238,.35)}
.row2{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.row2 .nx{margin:0}
.nx.alt{background:#fff;color:#4361ee;border:2px solid #cfd6ff;box-shadow:0 5px 0 #e3e0f7}
.end{text-align:center;background:#fff;border-radius:24px;padding:22px 16px;box-shadow:0 7px 0 #e6e3f7}
.end .bigem{font-size:64px}
.end h2{margin:4px 0;font-size:24px;color:#4361ee}
.end .stars{font-size:30px;letter-spacing:2px}
.review{text-align:left;margin-top:14px}
.review h3{margin:0 0 8px;color:#d9480f;font-size:17px}
.review div{background:#fff7e0;border-radius:12px;padding:9px 12px;margin-bottom:8px;font-size:15px}
.review div b{color:#1f9d55}
.lives{font-size:20px;letter-spacing:2px}

.flash{perspective:1000px;height:300px;margin:6px 0 14px;cursor:pointer}
.flash .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flash.fl .in{transform:rotateY(180deg)}
.flash .f{position:absolute;inset:0;border-radius:24px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.12)}
.flash .fr{background:#fff;border:4px solid var(--c1,#4361ee);font-size:26px;font-weight:800;color:var(--c2,#333)}
.flash .bk{background:linear-gradient(140deg,var(--c1,#4361ee),var(--c2,#b5179e));color:#fff;transform:rotateY(180deg);font-size:20px;font-weight:700;line-height:1.5}
.flash small{display:block;font-size:14px;font-weight:600;opacity:.75;margin-top:10px}

.mh{text-align:center;font-weight:800;color:#4a4f7a;margin-bottom:12px}
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:flex;flex-direction:column;gap:9px}
.mcol h4{margin:0;text-align:center;color:#4a4f7a}
.mb{border:2px solid #e3e0f7;background:#fff;border-radius:14px;padding:11px 9px;font-size:15px;line-height:1.35;box-shadow:0 4px 0 #e3e0f7}
.mb.sel{background:#fff1b8;border-color:#ffb703;box-shadow:0 4px 0 #ffb703}
.mb.done{background:#c9f7d6;border-color:#2fbf71;box-shadow:0 4px 0 #2fbf71;opacity:.75}
.mb.bad{background:#ffd3d3;border-color:#e5484d;animation:shake .35s}

.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px;min-height:46px}
.chipb{border:2px solid #e3e0f7;background:#fff;border-radius:99px;padding:9px 14px;font-size:15px;font-weight:700;box-shadow:0 4px 0 #e3e0f7}
.chipb.sel{background:#fff1b8;border-color:#ffb703;box-shadow:0 4px 0 #ffb703;transform:scale(1.05)}
.chipb.bad{background:#ffd3d3;animation:shake .35s}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bucket{border:3px dashed #cfc8f5;border-radius:18px;background:#fff;padding:10px;min-height:120px;text-align:center;cursor:pointer}
.bucket h4{margin:0 0 8px;font-size:16px}
.bucket div{background:#c9f7d6;border-radius:10px;padding:5px 8px;margin:5px 0;font-size:14px;font-weight:700}
.bucket.flashok{border-color:#2fbf71}

.oans{min-height:56px;background:#fff;border:3px dashed #cfc8f5;border-radius:16px;padding:8px;margin:12px 0}
.oans div{background:#c9f7d6;border-radius:10px;padding:8px 10px;margin:5px 0;font-size:15px;font-weight:700}
.oleft{display:grid;gap:9px}

.conf{position:fixed;top:-40px;font-size:28px;pointer-events:none;z-index:60;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(520deg);opacity:.6}}
@media (max-width:560px){.tab{font-size:13px}.top .tt b{font-size:16px}.mb{font-size:14px}}
</style>
</head>

inerals, and metals."], "a": [["g3-4"], ["g3-5"]]}]}, {"id": "g4", "title": "Q4. What might be the different criteria we can use to categorize natural resources?", "blocks": [{"table": {"head": ["Criteria", "Types"], "rows": [["1. Based on use", "For life | For material | For energy"], ["2. Based on renewability", "Renewable | Non-renewable"], ["3. Based on origin", "Biotic | Abiotic"], ["4. Based on status of development", "Potential | Actual | Stock | Reserve"], ["5. Based on distribution", "Ubiquitous | Localized"]]}, "a": [["g4-0"], ["g4-1"], ["g4-2"], ["g4-3"], ["g4-4"]]}]}, {"id": "g5", "title": "Q5. Distribution of natural resources and its implications", "blocks": [{"p": "Natural resources are unevenly distributed; it is mainly due to climate, relief, altitude, and geographical structure.", "a": ["g5-0"]}, {"h": "Implications:"}, {"ul": ["Some regions are rich in resources, while others are poor.", "Resource-rich areas develop more industries and create more employment opportunities for local people.", "Regions with fewer resources depend on other areas for their needs.", "Trade takes place between regions and countries which are resource-rich.", "Unequal distribution can lead to competition and conflicts over resources (e.g., Kaveri river issue)."], "a": [["g5-1"], ["g5-2"], ["g5-3"], ["g5-4"], ["g5-5"]]}, {"p": "Proper management and conservation became important for sustainable development.", "a": ["g5-6"]}]}, {"id": "g6", "title": "Q6. \"The natural resources curse.\" Explain.", "blocks": [{"p": "Having natural resources does not always make a country rich if the resources are not used properly. Development may remain slow.", "a": ["g6-0"]}, {"p": "E.g., a country has coal, petroleum, oil and minerals, but lacks industries, technology, and skilled labour; it cannot progress.", "a": ["g6-1"]}]}, {"id": "g7", "title": "Q7. What is sustainable development? Suggest some sustainable practices in our daily life.", "blocks": [{"p": "Sustainable development is the responsible and judicious (wise) use of resources, which means using resources wisely without wasting them so that they remain available for future generations.", "a": ["g7-0", "g7-0_1"]}, {"h": "Sustainable practices are:"}, {"ul": ["Use resources only as much as needed.", "Avoid overexploitation and wastage of resources.", "Protect renewable and non-renewable resources.", "Protect biodiversity.", "Promote recycling and reuse.", "Switch to renewable resources of energy for as many purposes as we can.", "Depend more on public transport than private transport."], "a": [["g7-1"], ["g7-2"], ["g7-3"], ["g7-4"], ["g7-5"], ["g7-6"], ["g7-7"]]}]}, {"id": "g8", "title": "Q8. Describe two traditional practices that help maintain ecological balance.", "blocks": [{"ul": ["Seasonal Fishing Bans: Fishing is traditionally avoided during the breeding season. This allows the fish population to regenerate and maintain marine biodiversity.", "Sacred Groves: Certain forest patches are protected owing to religious belief. This helps conserve biodiversity and protect native plant and animal species."], "a": [["g8-0"], ["g8-1"]]}]}, {"id": "g9", "title": "Q9. What led to groundwater depletion in Punjab during the Green Revolution?", "blocks": [{"p": "Cultivation of water-intensive crops such as rice and wheat increased the demand for irrigation.", "a": ["g9-0"]}, {"p": "Free electricity for farmers also encouraged the excessive use of tube wells for groundwater.", "a": ["g9-1"]}]}, {"id": "g10", "title": "Q10. Define ecosystem functions and explain how they benefit humans.", "blocks": [{"p": "Ecosystem functions are natural processes such as pollination, decomposition, water purification, climate regulation, etc.", "a": ["g10-0"]}, {"p": "They support human life by enabling clean air, fertile soil, agriculture, and a healthy ecosystem.", "a": ["g10-1"]}]}, {"id": "g11", "title": "Q11. What are renewable resources? How are they different from non-renewable ones? Give 2 examples.", "blocks": [{"p": "These are natural resources that regenerate or replenish naturally over time through ecological cycles. Their supply can be maintained if used sustainably. E.g., solar energy, forest timber.", "a": ["g11-0", "g11-0_1"]}, {"h": "Difference:"}, {"table": {"head": ["Basis", "Renewable Resources", "Non-Renewable Resources"], "rows": [["Definition", "Replenish naturally over time.", "Formed over millions of years; limited supply; finite and exhaustible."], ["Availability", "Unlimited if used wisely.", "Limited supply."], ["Examples", "Solar energy and forest timber.", "Coal, petroleum, minerals, etc."]]}, "a": [["g11-1"], ["g11-2"], ["g11-3"]]}]}], "quiz": [{"topic": "g1", "type": "fill", "q": "Resources are anything that has ____ and can be used to satisfy human needs.", "a": "value", "opts": ["value", "colour", "weight", "size"], "id": "geo-q0"}, {"topic": "g1", "type": "mcq", "q": "Which is NOT a feature of resources?", "a": "They are evenly distributed", "opts": ["They are evenly distributed", "They have utility", "They are unevenly distributed", "Their development depends on knowledge, skill and technology"], "id": "geo-q1"}, {"topic": "g1", "type": "tf", "q": "Development of resources depends on human beings, knowledge, skill and technology.", "a": "True", "opts": ["True", "False"], "id": "geo-q2"}, {"topic": "g2", "type": "mcq", "q": "When does nature become a resource?", "a": "When its materials are useful, valuable, accessible and used to satisfy human needs", "opts": ["When its materials are useful, valuable, accessible and used to satisfy human needs", "When it is very old", "When it is found deep underground", "When nobody can reach it"], "id": "geo-q3"}, {"topic": "g3", "type": "mcq", "q": "Air, water, soil and food are resources for ____.", "a": "Life", "opts": ["Life", "Materials", "Energy", "Decoration"], "id": "geo-q4"}, {"topic": "g3", "type": "mcq", "q": "Wood, marble, metals and minerals are resources for ____.", "a": "Materials", "opts": ["Materials", "Life", "Energy", "Transport"], "id": "geo-q5"}, {"topic": "g3", "type": "mcq", "q": "Coal, petroleum, sunlight and wind are resources for ____.", "a": "Energy", "opts": ["Energy", "Life", "Materials", "Food"], "id": "geo-q6"}, {"topic": "g3", "type": "tf", "q": "Renewable resources can be replenished (reproduced) naturally.", "a": "True", "opts": ["True", "False"], "id": "geo-q7"}, {"topic": "g3", "type": "mcq", "q": "Which of these is a NON-renewable resource?", "a": "Petroleum", "opts": ["Petroleum", "Sunlight", "Wind", "Forest"], "id": "geo-q8"}, {"topic": "g3", "type": "mcq", "q": "Which of these is a renewable resource?", "a": "Wind", "opts": ["Wind", "Coal", "Natural gas", "Metals"], "id": "geo-q9"}, {"topic": "g3", "type": "fill", "q": "Non-renewable resources take ____ of years to form and cannot be replaced quickly.", "a": "millions", "opts": ["millions", "hundreds", "tens", "a few"], "id": "geo-q10"}, {"topic": "g4", "type": "mcq", "q": "Biotic and Abiotic are types of resources based on ____.", "a": "Origin", "opts": ["Origin", "Use", "Distribution", "Renewability"], "id": "geo-q11"}, {"topic": "g4", "type": "mcq", "q": "Potential, Actual, Stock and Reserve are based on ____.", "a": "Status of development", "opts": ["Status of development", "Origin", "Use", "Distribution"], "id": "geo-q12"}, {"topic": "g4", "type": "mcq", "q": "Ubiquitous and Localized are based on ____.", "a": "Distribution", "opts": ["Distribution", "Origin", "Renewability", "Status of development"], "id": "geo-q13"}, {"topic": "g4", "type": "mcq", "q": "How many criteria to categorize natural resources are in your notes?", "a": "5", "opts": ["5", "2", "3", "7"], "id": "geo-q14"}, {"topic": "g5", "type": "mcq", "q": "Natural resources are unevenly distributed mainly due to ____.", "a": "Climate, relief, altitude and geographical structure", "opts": ["Climate, relief, altitude and geographical structure", "Population and language", "Roads and railways", "Schools and hospitals"], "id": "geo-q15"}, {"topic": "g5", "type": "mcq", "q": "Which example of conflict over resources is given in your notes?", "a": "Kaveri river issue", "opts": ["Kaveri river issue", "Green Revolution", "Sacred groves", "Seasonal fishing ban"], "id": "geo-q16"}, {"topic": "g5", "type": "tf", "q": "Resource-rich areas develop more industries and create more employment for local people.", "a": "True", "opts": ["True", "False"], "id": "geo-q17"}, {"topic": "g5", "type": "tf", "q": "Regions with fewer resources never depend on other areas.", "a": "False", "opts": ["True", "False"], "id": "geo-q18"}, {"topic": "g5", "type": "mcq", "q": "Trade takes place between regions and countries which are ____.", "a": "Resource-rich", "opts": ["Resource-rich", "Very cold", "Very small", "Far from the sea"], "id": "geo-q19"}, {"topic": "g6", "type": "mcq", "q": "What is the 'natural resources curse'?", "a": "Having resources does not make a country rich if they are not used properly", "opts": ["Having resources does not make a country rich if they are not used properly", "Resources are always harmful", "A country with resources is always rich", "Resources disappear very quickly"], "id": "geo-q20"}, {"topic": "g6", "type": "mcq", "q": "In the resource-curse example, the country cannot progress because it lacks ____.", "a": "Industries, technology and skilled labour", "opts": ["Industries, technology and skilled labour", "Coal and petroleum", "Oil and minerals", "Rivers and forests"], "id": "geo-q21"}, {"topic": "g7", "type": "fill", "q": "Sustainable development is the responsible and ____ (wise) use of resources.", "a": "judicious", "opts": ["judicious", "careless", "fast", "unlimited"], "id": "geo-q22"}, {"topic": "g7", "type": "mcq", "q": "Which is a sustainable practice?", "a": "Depend more on public transport than private transport", "opts": ["Depend more on public transport than private transport", "Use as much water as possible", "Throw away old things instead of reusing", "Use more coal for everything"], "id": "geo-q23"}, {"topic": "g7", "type": "tf", "q": "Promoting recycling and reuse is a sustainable practice.", "a": "True", "opts": ["True", "False"], "id": "geo-q24"}, {"topic": "g7", "type": "mcq", "q": "Why should we use resources wisely without wasting them?", "a": "So that they remain available for future generations", "opts": ["So that they remain available for future generations", "So that prices go up", "So that only rich people use them", "So that they finish quickly"], "id": "geo-q25"}, {"topic": "g8", "type": "fill", "q": "Fishing is traditionally avoided during the ____ season.", "a": "breeding", "opts": ["breeding", "summer", "festival", "winter"], "id": "geo-q26"}, {"topic": "g8", "type": "mcq", "q": "Sacred groves are forest patches protected owing to ____.", "a": "Religious belief", "opts": ["Religious belief", "Government tax", "Tourism", "Mining"], "id": "geo-q27"}, {"topic": "g8", "type": "tf", "q": "Seasonal fishing bans allow the fish population to regenerate and maintain marine biodiversity.", "a": "True", "opts": ["True", "False"], "id": "geo-q28"}, {"topic": "g8", "type": "tf", "q": "Sacred groves help conserve biodiversity and protect native plants and animals.", "a": "True", "opts": ["True", "False"], "id": "geo-q29"}, {"topic": "g9", "type": "mcq", "q": "Which crops increased the demand for irrigation in Punjab?", "a": "Rice and wheat", "opts": ["Rice and wheat", "Tea and coffee", "Cotton and jute", "Millets and pulses"], "id": "geo-q30"}, {"topic": "g9", "type": "mcq", "q": "What encouraged the excessive use of tube wells in Punjab?", "a": "Free electricity for farmers", "opts": ["Free electricity for farmers", "Heavy rainfall", "New rivers", "Fewer farmers"], "id": "geo-q31"}, {"topic": "g10", "type": "mcq", "q": "Which of these is an ecosystem function?", "a": "Pollination", "opts": ["Pollination", "Mining", "Building roads", "Manufacturing"], "id": "geo-q32"}, {"topic": "g10", "type": "tf", "q": "Ecosystem functions support human life by enabling clean air, fertile soil and agriculture.", "a": "True", "opts": ["True", "False"], "id": "geo-q33"}, {"topic": "g10", "type": "mcq", "q": "Which list has only ecosystem functions?", "a": "Pollination, decomposition, water purification, climate regulation", "opts": ["Pollination, decomposition, water purification, climate regulation", "Mining, drilling, cutting, burning", "Trade, transport, banking, shopping", "Coal, petroleum, gas, metals"], "id": "geo-q34"}, {"topic": "g11", "type": "mcq", "q": "Which are the two examples of renewable resources in Q11?", "a": "Solar energy and forest timber", "opts": ["Solar energy and forest timber", "Coal and petroleum", "Minerals and metals", "Natural gas and coal"], "id": "geo-q35"}, {"topic": "g11", "type": "tf", "q": "Non-renewable resources are finite and exhaustible.", "a": "True", "opts": ["True", "False"], "id": "geo-q36"}, {"topic": "g11", "type": "mcq", "q": "Availability of renewable resources is ____.", "a": "Unlimited if used wisely", "opts": ["Unlimited if used wisely", "Always limited", "Formed over millions of years", "Finished after one use"], "id": "geo-q37"}, {"topic": "g11", "type": "mcq", "q": "Renewable resources regenerate naturally through ____.", "a": "Ecological cycles", "opts": ["Ecological cycles", "Factories", "Mining", "Trade"], "id": "geo-q38"}], "match": [{"title": "Criteria ↔ Types", "left": "Criteria", "right": "Types", "pairs": [["Based on use", "For life, material, energy"], ["Based on renewability", "Renewable, Non-renewable"], ["Based on origin", "Biotic, Abiotic"], ["Based on status of development", "Potential, Actual, Stock, Reserve"], ["Based on distribution", "Ubiquitous, Localized"]]}, {"title": "Term ↔ Meaning", "left": "Term", "right": "Meaning", "pairs": [["Resources", "Anything with value that satisfies human needs"], ["Sustainable development", "Judicious use so resources remain for future generations"], ["Resource curse", "Resources don't make a country rich if not used properly"], ["Sacred groves", "Forest patches protected due to religious belief"], ["Seasonal fishing ban", "No fishing during the breeding season"], ["Ecosystem functions", "Natural processes like pollination and decomposition"], ["Punjab groundwater depletion", "Rice, wheat and free electricity for tube wells"]]}], "sort": [{"title": "Renewable or Non-renewable?", "buckets": ["♻️ Renewable", "⛏️ Non-renewable"], "items": [["Sunlight", 0], ["Wind", 0], ["Water", 0], ["Forest", 0], ["Solar energy", 0], ["Forest timber", 0], ["Coal", 1], ["Petroleum", 1], ["Natural gas", 1], ["Minerals", 1], ["Metals", 1]]}, {"title": "Resources for Life, Materials or Energy?", "buckets": ["🫁 Life", "🧱 Materials", "⚡ Energy"], "items": [["Air", 0], ["Soil", 0], ["Food", 0], ["Wood", 1], ["Marble", 1], ["Metals", 1], ["Minerals", 1], ["Coal", 2], ["Petroleum", 2], ["Natural gas", 2], ["Sunlight", 2], ["Flowing water", 2]]}, {"title": "Sustainable or Not?", "buckets": ["✅ Sustainable", "❌ Not sustainable"], "items": [["Use resources only as much as needed", 0], ["Promote recycling and reuse", 0], ["Protect biodiversity", 0], ["Switch to renewable energy", 0], ["Use public transport", 0], ["Overexploitation of resources", 1], ["Wastage of resources", 1], ["Excessive use of tube wells", 1]]}], "order": [], "flash": [["Resources", "Anything that has value and can be used to satisfy human needs."], ["Features of resources", "Utility; unevenly distributed; development depends on human beings, knowledge, skill and technology."], ["Nature becomes a resource when…", "Its materials are useful, valuable, accessible and used to satisfy human needs."], ["Renewable resources", "Replenished naturally. E.g., sunlight, wind, water, forest."], ["Non-renewable resources", "Take millions of years to form. E.g., coal, petroleum, natural gas, minerals, metals."], ["5 criteria", "Use, renewability, origin, status of development, distribution."], ["Why uneven distribution?", "Climate, relief, altitude and geographical structure."], ["Resource curse", "Resources don't make a country rich without proper use, industries, technology and skilled labour."], ["Sustainable development", "Responsible and judicious (wise) use so resources remain for future generations."], ["Seasonal fishing bans", "No fishing in the breeding season, so fish regenerate."], ["Sacred groves", "Forest patches protected owing to religious belief; conserve biodiversity."], ["Punjab groundwater depletion", "Water-intensive rice and wheat + free electricity → excessive tube wells."], ["Ecosystem functions", "Pollination, decomposition, water purification, climate regulation → clean air, fertile soil, agriculture."]], "summaryAudio": [["geo-s0"], ["geo-s1"], ["geo-s2"], ["geo-s3"], ["geo-s4", "geo-s4_1"], ["geo-s5"], ["geo-s6"], ["geo-s7"], ["geo-s8"], ["geo-s9"], ["geo-s10"], ["geo-s11"], ["geo-s12"], ["geo-s13"], ["geo-s14", "geo-s14_1"]]}, {"id": "his", "subject": "History", "title": "Mughal Empire & Delhi Sultanate", "short": "Mughals & Sultanate", "emoji": "🏰", "c1": "#f77f00", "c2": "#d62828", "summary": ["Babur founded the Mughal Empire in 1526 after defeating Ibrahim Lodi in the First Battle of Panipat, ending the Delhi Sultanate.", "Babur (1526 to 1530): Turkic-Mongol ruler from Samarkand, descendant of Timur. Brought gunpowder, field artillery and matchlock guns. Wrote the Baburnama. Died in 1530.", "Humayun (1530 to 1556) died after a fall in 1556.", "Akbar (1556 to 1605) became emperor at 13. He followed Sulh-i-kul (peace with all), abolished jizya, welcomed Rajputs, made marriage alliances and appointed Hindu officials.", "Akbar used the Mansabdari system and set up a house of translation at Fatehpur Sikri, where the Mahabharata, Ramayana, Bhagavad Gita and Panchatantra were translated into Persian.", "Jahangir upheld Islamic authority, tried to expand into the Deccan, and executed Guru Arjan Dev, which led to Sikh resistance.", "Shahjahan (1628 to 1658) was the architectural pinnacle: he built the Taj Mahal and the Red Fort.", "Aurangzeb (1658 to 1707) seized the throne from Dara Shikoh, imprisoned Shahjahan, took the title Alamgir, ruled about 49 years and made the empire its largest.", "Aurangzeb was orthodox: he banned music and dance in court, reintroduced jizya and pilgrimage tax, and persecuted Shias and Sufis.", "Delhi Sultanate: the Sultan held absolute power. Under the Iqta system, nobles called Iqtadars collected revenue for the army. Posts were not hereditary. Peasants paid the highest tax.", "Akbar's administration: 12 provinces (Subhas). Diwan for finance, Mir Bakshi for military, Khan-i-Saman for trade, industry, agriculture and household, Sadar for justice, religion and education.", "Mansabdari system: recorded in Ain-i-Akbari by Abul Fazl. Mansabdars kept troops, elephants, horses and camels, and were paid with land called Jagirs.", "Todarmal, Akbar's finance minister, made revenue reforms: crop surveys, price standardisation, land measurement and mapping.", "Non-Muslims were a minority in top posts, and Muslims of foreign origin were often favoured over Indian Muslims.", "People's lives: rich agriculture, trade through ports like Calicut, Surat, Masulipatnam and Hooghly, Marwari credit trade and the Hundi system.", "Problems: by the late 1600s peasants faced high taxes and became bonded labourers, wealth stayed with rulers and merchants, and wars displaced people. Still, India stayed prosperous and culturally vibrant."], "topics": [{"id": "h1", "title": "Mughal Empire (1526–1707)", "blocks": [{"ul": ["The Mughal Empire was founded in 1526 by Babur after he defeated Ibrahim Lodi in the First Battle of Panipat, thus ending the reign of the Delhi Sultanate."], "a": [["h1-0"]]}]}, {"id": "h2", "title": "a) Babur (1526–1530)", "blocks": [{"ul": ["Babur was a Turkic-Mongol ruler from Samarkand, and he was a descendant of Timur and became the first ruler of the Mughal Empire.", "He introduced gun powder, field artillery and matchlock guns. Those were first used in India in the First Battle of Panipat.", "He authored the Baburnama (autobiography of Babur), showing his refined interests in poetry, architecture, gardens and fauna.", "Known for ruthless conquest strategy including creating \"towers of skulls\" from defeated forces.", "Babur died in 1530."], "a": [["h2-0"], ["h2-1"], ["h2-2"], ["h2-3"], ["h2-4"]]}]}, {"id": "h3", "title": "b) Humayun (1530–1556)", "blocks": [{"ul": ["Humayun died after a fall in 1556."], "a": [["h3-0"]]}]}, {"id": "h4", "title": "c) Akbar (1556–1605)", "blocks": [{"ul": ["Humayun's accidental death in 1556 AD resulted in his son Akbar becoming emperor at a very young age of 13, through the victory at Panipat.", "He expanded the empire through conquests and smart alliances and established a strong and lasting Mughal rule in India.", "He instituted Sulh-i-kul (Peace with all), abolished the jizya tax, and welcomed Rajputs into his court.", "He entered into marriage alliances with princesses of neighbouring kingdoms and even appointed Hindu officials to high posts. Therefore, he blended administrative cohesion and religious harmony.", "Used the Mansabdari system to organise bureaucracy with ranks tied to military service.", "Although illiterate, he still had great interest in Persian and Indian texts.", "He established a house of translation at Fatehpur Sikri where he commissioned the translation of Sanskrit texts: Mahabharata, Ramayana, Bhagavad Gita, and the Panchatantra into Persian.", "Akbar was known for his liberal approach and religious tolerance.", "Akbar died in 1605."], "a": [["h4-0"], ["h4-1"], ["h4-2"], ["h4-3", "h4-3_1"], ["h4-4"], ["h4-5"], ["h4-6"], ["h4-7"], ["h4-8"]]}]}, {"id": "h5", "title": "d) Jahangir (Jahangir and Shahjahan, 1605–1658)", "blocks": [{"ul": ["Jahangir upheld Islamic authority and tried to expand into the Deccan.", "He patronised religion but also faced friction, most notably after executing Guru Arjan Dev, which led to Sikh resistance."], "a": [["h5-0"], ["h5-1"]]}]}, {"id": "h6", "title": "e) Shahjahan (1628–1658)", "blocks": [{"ul": ["Shahjahan marked the architectural pinnacle of the Empire.", "He built architectural marvels like the Taj Mahal and Red Fort.", "Fought rebellions to consolidate his rule."], "a": [["h6-0"], ["h6-1"], ["h6-2"]]}]}, {"id": "h7", "title": "f) Aurangzeb (1658–1707)", "blocks": [{"ul": ["Aurangzeb seized the throne from his elder brother Dara Shikoh in 1658 and even imprisoned his father Shahjahan until his death.", "He gave himself the title of \"Alamgir\" and ruled for approximately 49 years.", "He conducted many campaigns and brought the Mughal Empire to its greatest territorial extent.", "He was an orthodox ruler. He banned bands, dance, and music in his court, labeling them un-Islamic.", "He reintroduced Jizya tax on non-Muslims and Pilgrimage tax on Hindus.", "This aspect of Aurangzeb was also visible in his persecution of Muslims of other sects, including Shias and Sufis.", "Aurangzeb died in 1707."], "a": [["h7-0"], ["h7-1"], ["h7-2"], ["h7-3"], ["h7-4"], ["h7-5"], ["h7-6"]]}]}, {"id": "h8", "title": "Administrative System: Delhi Sultanate Administration", "blocks": [{"ul": ["There was central authority and the Sultan held absolute power, both political and military.", "Key responsibilities included defending Islamic territories, tax collection, and monitoring public welfare.", "Council of ministers managed the various departments of government, alongside governors."], "a": [["h8-0"], ["h8-1"], ["h8-2"]]}]}, {"id": "h9", "title": "Iqta System in Delhi Sultanate", "blocks": [{"ul": ["Land or Iqta was assigned to nobles (Iqtadars) to collect revenues for the army; the rest went to the Sultan's treasury.", "Posts were not hereditary; hence, while maintaining central control, the system created local loyalty to the Sultan.", "Peasants were burdened with the highest tax, with frequent cruelty reported in revenue collections."], "a": [["h9-0"], ["h9-1"], ["h9-2"]]}]}, {"id": "h10", "title": "Mughal Administration (Under Akbar)", "blocks": [{"ul": ["Akbar restructured the administration for efficiency and control; divided into 12 Provinces (Subhas)."], "a": [["h10-0"]]}, {"table": {"head": ["Official Title", "Role / Function"], "rows": [["Diwan", "Managed finances and revenue"], ["Mir Bakshi", "In charge of military affairs"], ["Khan-i-Saman", "Supervised trade, industry, agriculture, royal household"], ["Sadar", "Handled justice, religion and education"]]}, "a": [["h10-1"], ["h10-2"], ["h10-3"], ["h10-4"]]}, {"ul": ["Each of the 12 provinces had all such ministers.", "While maintaining checks and balances among officials, Subhas were further divided under official control.", "At the village level, traditional self-governance remained intact."], "a": [["h10-5"], ["h10-6"], ["h10-7"]]}]}, {"id": "h11", "title": "Mansabdari System", "blocks": [{"ul": ["Introduced by Akbar, recorded in Ain-i-Akbari by Abul Fazl.", "Mansabdars (ranked officers) had to maintain a specified number of troops, elephants, horses, camels.", "This enabled the maintenance of a flexible and quick army without permanent costs.", "Mansabdars were paid with land (Jagirs).", "Regular inspections ensured loyalty and complaints."], "a": [["h11-0"], ["h11-1"], ["h11-2"], ["h11-3"], ["h11-4"]]}]}, {"id": "h12", "title": "Revenue Reforms", "blocks": [{"ul": ["Todarmal was Akbar's finance minister. He introduced an efficient revenue system: crop yield surveys, price standardisation for different crops, systematic land measurement, and mapping across the Empire.", "These reforms made tax collection more efficient and strengthened state control."], "a": [["h12-0", "h12-0_1"], ["h12-1"]]}]}, {"id": "h13", "title": "Religious Composition in Administration", "blocks": [{"ul": ["Despite Akbar's practical, tolerant policies, non-Muslims were a minority in top posts.", "Muslims of foreign origin were often favoured over Indian Muslims."], "a": [["h13-0"], ["h13-1"]]}]}, {"id": "h14", "title": "People's Lives: Economy and Trade", "blocks": [{"ul": ["India had a strong agricultural economy and was one of the wealthiest regions in the world.", "Roads, bridges, canals, and irrigation works expanded during the Sultanate and Mughal periods.", "Agriculture improved due to irrigation systems and the cultivation of multiple crops such as sugarcane, rice, wheat, barley, cotton, and spices.", "Textiles, shipbuilding, handicrafts, jewellery, and metal works developed greatly.", "India had extensive internal and overseas trade through ports like Calicut, Surat, Masulipatnam, or Hooghly.", "Merchant communities like the Marwaris developed a system of credit trade.", "The Hundi system helped merchants transfer money without carrying cash."], "a": [["h14-0"], ["h14-1"], ["h14-2"], ["h14-3"], ["h14-4"], ["h14-5"], ["h14-6"]]}]}, {"id": "h15", "title": "People's Lives: Hardships and Society", "blocks": [{"ul": ["By the late 1600s, many peasants suffered from high taxes, lost their land, and became bonded labourers.", "Wealth was mainly concentrated in the hands of the rulers, courtiers, high officials, and the merchants.", "Frequent warfare caused forced displacements of people and economic hardship.", "Despite some conflicts, people of different religious communities generally lived peacefully together and depended on one another.", "Though politically unstable, India remained economically prosperous and culturally vibrant."], "a": [["h15-0"], ["h15-1"], ["h15-2"], ["h15-3"], ["h15-4"]]}]}], "quiz": [{"topic": "h1", "type": "mcq", "q": "Who founded the Mughal Empire?", "a": "Babur", "opts": ["Babur", "Akbar", "Humayun", "Ibrahim Lodi"], "id": "his-q0"}, {"topic": "h1", "type": "mcq", "q": "In which year was the Mughal Empire founded?", "a": "1526", "opts": ["1526", "1556", "1605", "1707"], "id": "his-q1"}, {"topic": "h1", "type": "mcq", "q": "Babur defeated whom in the First Battle of Panipat?", "a": "Ibrahim Lodi", "opts": ["Ibrahim Lodi", "Dara Shikoh", "Todarmal", "Guru Arjan Dev"], "id": "his-q2"}, {"topic": "h1", "type": "tf", "q": "The First Battle of Panipat ended the reign of the Delhi Sultanate.", "a": "True", "opts": ["True", "False"], "id": "his-q3"}, {"topic": "h2", "type": "mcq", "q": "Babur was a Turkic-Mongol ruler from ____.", "a": "Samarkand", "opts": ["Samarkand", "Delhi", "Fatehpur Sikri", "Surat"], "id": "his-q4"}, {"topic": "h2", "type": "mcq", "q": "Babur was a descendant of ____.", "a": "Timur", "opts": ["Timur", "Akbar", "Ibrahim Lodi", "Todarmal"], "id": "his-q5"}, {"topic": "h2", "type": "mcq", "q": "What did Babur introduce, first used in India in the First Battle of Panipat?", "a": "Gunpowder, field artillery and matchlock guns", "opts": ["Gunpowder, field artillery and matchlock guns", "Elephants and camels", "Swords and shields", "Ships and boats"], "id": "his-q6"}, {"topic": "h2", "type": "mcq", "q": "Babur's autobiography is called the ____.", "a": "Baburnama", "opts": ["Baburnama", "Ain-i-Akbari", "Panchatantra", "Mahabharata"], "id": "his-q7"}, {"topic": "h2", "type": "tf", "q": "Babur was known for a ruthless conquest strategy, including 'towers of skulls'.", "a": "True", "opts": ["True", "False"], "id": "his-q8"}, {"topic": "h2", "type": "mcq", "q": "The Baburnama shows Babur's interest in ____.", "a": "Poetry, architecture, gardens and fauna", "opts": ["Poetry, architecture, gardens and fauna", "Banking and trade", "Ships and ports", "Taxes and revenue"], "id": "his-q9"}, {"topic": "h2", "type": "mcq", "q": "Babur died in ____.", "a": "1530", "opts": ["1530", "1526", "1556", "1605"], "id": "his-q10"}, {"topic": "h3", "type": "mcq", "q": "How did Humayun die in 1556?", "a": "After a fall", "opts": ["After a fall", "In a battle", "In a shipwreck", "Of old age"], "id": "his-q11"}, {"topic": "h4", "type": "mcq", "q": "At what age did Akbar become emperor?", "a": "13", "opts": ["13", "18", "25", "10"], "id": "his-q12"}, {"topic": "h4", "type": "mcq", "q": "Akbar's policy 'Sulh-i-kul' means ____.", "a": "Peace with all", "opts": ["Peace with all", "War with all", "Tax on all", "Rule by one"], "id": "his-q13"}, {"topic": "h4", "type": "mcq", "q": "Which tax did Akbar abolish?", "a": "Jizya", "opts": ["Jizya", "Land revenue", "Trade tax", "Salt tax"], "id": "his-q14"}, {"topic": "h4", "type": "tf", "q": "Akbar appointed Hindu officials to high posts and welcomed Rajputs into his court.", "a": "True", "opts": ["True", "False"], "id": "his-q15"}, {"topic": "h4", "type": "mcq", "q": "Akbar organised the bureaucracy using the ____ system.", "a": "Mansabdari", "opts": ["Mansabdari", "Iqta", "Hundi", "Sulh-i-kul"], "id": "his-q16"}, {"topic": "h4", "type": "mcq", "q": "Where did Akbar set up a house of translation?", "a": "Fatehpur Sikri", "opts": ["Fatehpur Sikri", "Samarkand", "Red Fort", "Surat"], "id": "his-q17"}, {"topic": "h4", "type": "mcq", "q": "Which texts were translated into Persian under Akbar?", "a": "Mahabharata, Ramayana, Bhagavad Gita and Panchatantra", "opts": ["Mahabharata, Ramayana, Bhagavad Gita and Panchatantra", "Baburnama and Ain-i-Akbari", "Only the Quran", "Persian poems into Sanskrit"], "id": "his-q18"}, {"topic": "h4", "type": "tf", "q": "Akbar was highly educated and could read many languages.", "a": "False", "opts": ["True", "False"], "id": "his-q19"}, {"topic": "h4", "type": "tf", "q": "Akbar blended administrative cohesion and religious harmony.", "a": "True", "opts": ["True", "False"], "id": "his-q20"}, {"topic": "h4", "type": "mcq", "q": "Akbar died in ____.", "a": "1605", "opts": ["1605", "1556", "1658", "1707"], "id": "his-q21"}, {"topic": "h5", "type": "mcq", "q": "Jahangir's execution of whom led to Sikh resistance?", "a": "Guru Arjan Dev", "opts": ["Guru Arjan Dev", "Dara Shikoh", "Ibrahim Lodi", "Todarmal"], "id": "his-q22"}, {"topic": "h5", "type": "mcq", "q": "Jahangir tried to expand into the ____.", "a": "Deccan", "opts": ["Deccan", "Samarkand", "Persia", "Sea"], "id": "his-q23"}, {"topic": "h6", "type": "mcq", "q": "Which ruler marked the architectural pinnacle of the Mughal Empire?", "a": "Shahjahan", "opts": ["Shahjahan", "Babur", "Aurangzeb", "Humayun"], "id": "his-q24"}, {"topic": "h6", "type": "mcq", "q": "Shahjahan built ____.", "a": "The Taj Mahal and the Red Fort", "opts": ["The Taj Mahal and the Red Fort", "A house of translation", "Towers of skulls", "The Iqta system"], "id": "his-q25"}, {"topic": "h7", "type": "mcq", "q": "Aurangzeb seized the throne from his elder brother ____.", "a": "Dara Shikoh", "opts": ["Dara Shikoh", "Jahangir", "Humayun", "Todarmal"], "id": "his-q26"}, {"topic": "h7", "type": "mcq", "q": "Aurangzeb gave himself the title ____.", "a": "Alamgir", "opts": ["Alamgir", "Sulh-i-kul", "Diwan", "Mir Bakshi"], "id": "his-q27"}, {"topic": "h7", "type": "mcq", "q": "Aurangzeb ruled for approximately ____ years.", "a": "49", "opts": ["49", "13", "30", "4"], "id": "his-q28"}, {"topic": "h7", "type": "tf", "q": "Aurangzeb brought the Mughal Empire to its greatest territorial extent.", "a": "True", "opts": ["True", "False"], "id": "his-q29"}, {"topic": "h7", "type": "mcq", "q": "Which taxes did Aurangzeb reintroduce?", "a": "Jizya on non-Muslims and pilgrimage tax on Hindus", "opts": ["Jizya on non-Muslims and pilgrimage tax on Hindus", "Salt tax and trade tax", "Tax on music and dance", "No taxes at all"], "id": "his-q30"}, {"topic": "h7", "type": "tf", "q": "Aurangzeb encouraged music and dance in his court.", "a": "False", "opts": ["True", "False"], "id": "his-q31"}, {"topic": "h7", "type": "mcq", "q": "Aurangzeb persecuted Muslims of other sects, including ____.", "a": "Shias and Sufis", "opts": ["Shias and Sufis", "Rajputs and Marwaris", "Sikhs and Jains", "Iqtadars and Mansabdars"], "id": "his-q32"}, {"topic": "h7", "type": "mcq", "q": "Aurangzeb imprisoned whom until his death?", "a": "His father Shahjahan", "opts": ["His father Shahjahan", "Babur", "Akbar", "Guru Arjan Dev"], "id": "his-q33"}, {"topic": "h7", "type": "mcq", "q": "Aurangzeb died in ____.", "a": "1707", "opts": ["1707", "1658", "1605", "1530"], "id": "his-q34"}, {"topic": "h8", "type": "mcq", "q": "In the Delhi Sultanate, who held absolute political and military power?", "a": "The Sultan", "opts": ["The Sultan", "The peasants", "The merchants", "The village council"], "id": "his-q35"}, {"topic": "h8", "type": "tf", "q": "A council of ministers managed the various departments of government, alongside governors.", "a": "True", "opts": ["True", "False"], "id": "his-q36"}, {"topic": "h8", "type": "mcq", "q": "Which was a key responsibility of the Sultanate?", "a": "Tax collection and monitoring public welfare", "opts": ["Tax collection and monitoring public welfare", "Building the Taj Mahal", "Translating Sanskrit texts", "Running the Hundi system"], "id": "his-q37"}, {"topic": "h9", "type": "mcq", "q": "In the Iqta system, land was assigned to nobles called ____.", "a": "Iqtadars", "opts": ["Iqtadars", "Mansabdars", "Diwans", "Marwaris"], "id": "his-q38"}, {"topic": "h9", "type": "tf", "q": "Iqta posts were hereditary.", "a": "False", "opts": ["True", "False"], "id": "his-q39"}, {"topic": "h9", "type": "mcq", "q": "Iqtadars collected revenue mainly for ____.", "a": "The army", "opts": ["The army", "Temples", "Schools", "Ports"], "id": "his-q40"}, {"topic": "h9", "type": "mcq", "q": "Who was burdened with the highest tax in the Delhi Sultanate?", "a": "Peasants", "opts": ["Peasants", "Nobles", "Merchants", "Ministers"], "id": "his-q41"}, {"topic": "h10", "type": "mcq", "q": "Akbar divided his empire into how many provinces (Subhas)?", "a": "12", "opts": ["12", "5", "20", "49"], "id": "his-q42"}, {"topic": "h10", "type": "mcq", "q": "Which official managed finances and revenue?", "a": "Diwan", "opts": ["Diwan", "Mir Bakshi", "Khan-i-Saman", "Sadar"], "id": "his-q43"}, {"topic": "h10", "type": "mcq", "q": "The Mir Bakshi was in charge of ____.", "a": "Military affairs", "opts": ["Military affairs", "Finances", "Justice", "Royal household"], "id": "his-q44"}, {"topic": "h10", "type": "mcq", "q": "Who supervised trade, industry, agriculture and the royal household?", "a": "Khan-i-Saman", "opts": ["Khan-i-Saman", "Diwan", "Sadar", "Mir Bakshi"], "id": "his-q45"}, {"topic": "h10", "type": "mcq", "q": "The Sadar handled ____.", "a": "Justice, religion and education", "opts": ["Justice, religion and education", "Military affairs", "Finances and revenue", "Trade and industry"], "id": "his-q46"}, {"topic": "h10", "type": "tf", "q": "At the village level, traditional self-governance remained intact.", "a": "True", "opts": ["True", "False"], "id": "his-q47"}, {"topic": "h11", "type": "mcq", "q": "The Mansabdari system was recorded in Ain-i-Akbari by ____.", "a": "Abul Fazl", "opts": ["Abul Fazl", "Todarmal", "Babur", "Jahangir"], "id": "his-q48"}, {"topic": "h11", "type": "mcq", "q": "Mansabdars were paid with land called ____.", "a": "Jagirs", "opts": ["Jagirs", "Subhas", "Hundis", "Ports"], "id": "his-q49"}, {"topic": "h11", "type": "tf", "q": "The Mansabdari system gave a flexible and quick army without permanent costs.", "a": "True", "opts": ["True", "False"], "id": "his-q50"}, {"topic": "h11", "type": "mcq", "q": "Mansabdars had to maintain a specified number of ____.", "a": "Troops, elephants, horses and camels", "opts": ["Troops, elephants, horses and camels", "Ships and boats", "Schools and temples", "Shops and markets"], "id": "his-q51"}, {"topic": "h12", "type": "mcq", "q": "Who was Akbar's finance minister?", "a": "Todarmal", "opts": ["Todarmal", "Abul Fazl", "Dara Shikoh", "Babur"], "id": "his-q52"}, {"topic": "h12", "type": "mcq", "q": "Which was part of Todarmal's revenue system?", "a": "Crop yield surveys and systematic land measurement", "opts": ["Crop yield surveys and systematic land measurement", "Free electricity for farmers", "Banning music in court", "Towers of skulls"], "id": "his-q53"}, {"topic": "h12", "type": "tf", "q": "Todarmal's reforms made tax collection more efficient and strengthened state control.", "a": "True", "opts": ["True", "False"], "id": "his-q54"}, {"topic": "h13", "type": "tf", "q": "Non-Muslims were a minority in top posts, even under Akbar.", "a": "True", "opts": ["True", "False"], "id": "his-q55"}, {"topic": "h13", "type": "mcq", "q": "Who were often favoured over Indian Muslims in administration?", "a": "Muslims of foreign origin", "opts": ["Muslims of foreign origin", "Rajputs", "Marwaris", "Peasants"], "id": "his-q56"}, {"topic": "h14", "type": "mcq", "q": "Which of these was a port for trade?", "a": "Surat", "opts": ["Surat", "Samarkand", "Fatehpur Sikri", "Panipat"], "id": "his-q57"}, {"topic": "h14", "type": "mcq", "q": "Which merchant community developed a system of credit trade?", "a": "Marwaris", "opts": ["Marwaris", "Iqtadars", "Mansabdars", "Sufis"], "id": "his-q58"}, {"topic": "h14", "type": "fill", "q": "The ____ system helped merchants transfer money without carrying cash.", "a": "Hundi", "opts": ["Hundi", "Iqta", "Jagir", "Mansabdari"], "id": "his-q59"}, {"topic": "h14", "type": "tf", "q": "India had a strong agricultural economy and was one of the wealthiest regions in the world.", "a": "True", "opts": ["True", "False"], "id": "his-q60"}, {"topic": "h14", "type": "mcq", "q": "Which list shows crops grown in this period (from your notes)?", "a": "Sugarcane, rice, wheat, barley, cotton and spices", "opts": ["Sugarcane, rice, wheat, barley, cotton and spices", "Tea, coffee and rubber only", "Potatoes and tomatoes only", "No crops were grown"], "id": "his-q61"}, {"topic": "h14", "type": "mcq", "q": "Which crafts and industries developed greatly?", "a": "Textiles, shipbuilding, handicrafts, jewellery and metal works", "opts": ["Textiles, shipbuilding, handicrafts, jewellery and metal works", "Cars and computers", "Railways and telephones", "Plastic and rubber"], "id": "his-q62"}, {"topic": "h15", "type": "mcq", "q": "By the late 1600s, many peasants ____.", "a": "Lost their land to high taxes and became bonded labourers", "opts": ["Lost their land to high taxes and became bonded labourers", "Became very rich merchants", "Became Mansabdars", "Stopped farming completely"], "id": "his-q63"}, {"topic": "h15", "type": "tf", "q": "Wealth was spread equally among all people.", "a": "False", "opts": ["True", "False"], "id": "his-q64"}, {"topic": "h15", "type": "tf", "q": "People of different religious communities generally lived peacefully and depended on one another.", "a": "True", "opts": ["True", "False"], "id": "his-q65"}, {"topic": "h15", "type": "mcq", "q": "India in this period was politically unstable but ____.", "a": "Economically prosperous and culturally vibrant", "opts": ["Economically prosperous and culturally vibrant", "Very poor everywhere", "Without any trade", "Ruled by one village"], "id": "his-q66"}], "match": [{"title": "Official ↔ Role", "left": "Official", "right": "Role", "pairs": [["Diwan", "Finances and revenue"], ["Mir Bakshi", "Military affairs"], ["Khan-i-Saman", "Trade, industry, agriculture, royal household"], ["Sadar", "Justice, religion and education"]]}, {"title": "Ruler ↔ Famous for", "left": "Ruler", "right": "Famous for", "pairs": [["Babur", "Baburnama and matchlock guns"], ["Humayun", "Died after a fall in 1556"], ["Akbar", "Sulh-i-kul (peace with all)"], ["Jahangir", "Executed Guru Arjan Dev"], ["Shahjahan", "Taj Mahal and Red Fort"], ["Aurangzeb", "Title 'Alamgir'"]]}, {"title": "Ruler ↔ Years", "left": "Ruler", "right": "Years", "pairs": [["Babur", "1526–1530"], ["Humayun", "1530–1556"], ["Akbar", "1556–1605"], ["Shahjahan", "1628–1658"], ["Aurangzeb", "1658–1707"]]}, {"title": "Word ↔ Meaning", "left": "Word", "right": "Meaning", "pairs": [["Sulh-i-kul", "Peace with all"], ["Iqta", "Land given to nobles to collect revenue"], ["Jagir", "Land paid to Mansabdars"], ["Hundi", "Transfer money without carrying cash"], ["Subha", "Province"], ["Jizya", "Tax on non-Muslims"], ["Ain-i-Akbari", "Written by Abul Fazl"], ["Alamgir", "Title taken by Aurangzeb"]]}], "sort": [{"title": "Delhi Sultanate or Mughals (Akbar)?", "buckets": ["🕌 Delhi Sultanate", "👑 Mughals (Akbar)"], "items": [["Iqta system", 0], ["Iqtadars", 0], ["Sultan held absolute power", 0], ["Posts not hereditary (Iqta)", 0], ["Mansabdari system", 1], ["12 Subhas", 1], ["Diwan and Mir Bakshi", 1], ["Todarmal's revenue reforms", 1], ["Jagirs", 1]]}, {"title": "Akbar or Aurangzeb?", "buckets": ["🕊️ Akbar", "⚔️ Aurangzeb"], "items": [["Abolished jizya", 0], ["Sulh-i-kul", 0], ["Appointed Hindu officials", 0], ["House of translation", 0], ["Became emperor at 13", 0], ["Reintroduced jizya", 1], ["Banned music and dance in court", 1], ["Title 'Alamgir'", 1], ["Persecuted Shias and Sufis", 1], ["Imprisoned Shahjahan", 1]]}, {"title": "Good times or Hardships?", "buckets": ["🌾 Prosperity", "😟 Hardship"], "items": [["Strong agricultural economy", 0], ["Trade through Surat and Calicut", 0], ["Hundi system", 0], ["Textiles and shipbuilding", 0], ["Peasants became bonded labourers", 1], ["Wealth with rulers and merchants", 1], ["Forced displacement by warfare", 1]]}], "order": [{"title": "Mughal rulers in order", "items": ["Babur", "Humayun", "Akbar", "Jahangir", "Shahjahan", "Aurangzeb"]}, {"title": "Timeline of events", "items": ["1526: Babur wins the First Battle of Panipat", "1530: Babur dies", "1556: Humayun dies; Akbar becomes emperor at 13", "1605: Akbar dies", "1628: Shahjahan's rule begins", "1658: Aurangzeb seizes the throne", "1707: Aurangzeb dies"]}], "flash": [["1526", "Babur founds the Mughal Empire after defeating Ibrahim Lodi (First Battle of Panipat)."], ["Babur", "From Samarkand, descendant of Timur; gunpowder, field artillery, matchlock guns; wrote the Baburnama; died 1530."], ["Humayun", "Ruled 1530–1556; died after a fall in 1556."], ["Akbar", "Emperor at 13; Sulh-i-kul; abolished jizya; Rajputs; Mansabdari; house of translation at Fatehpur Sikri."], ["Jahangir", "Expanded into the Deccan; executed Guru Arjan Dev → Sikh resistance."], ["Shahjahan", "Architectural pinnacle: Taj Mahal and Red Fort."], ["Aurangzeb", "Title Alamgir; ~49 years; largest empire; reintroduced jizya; banned music; died 1707."], ["Iqta system", "Land given to nobles (Iqtadars) to collect revenue for the army; not hereditary."], ["Diwan / Mir Bakshi", "Diwan: finances and revenue. Mir Bakshi: military affairs."], ["Khan-i-Saman / Sadar", "Khan-i-Saman: trade, industry, agriculture, royal household. Sadar: justice, religion, education."], ["Mansabdari", "Ranked officers keep troops, elephants, horses, camels; paid with Jagirs; in Ain-i-Akbari by Abul Fazl."], ["Todarmal", "Akbar's finance minister: crop surveys, price standardisation, land measurement, mapping."], ["Hundi", "System to transfer money without carrying cash."], ["Ports", "Calicut, Surat, Masulipatnam, Hooghly."]], "summaryAudio": [["his-s0"], ["his-s1"], ["his-s2"], ["his-s3"], ["his-s4"], ["his-s5"], ["his-s6"], ["his-s7"], ["his-s8"], ["his-s9"], ["his-s10", "his-s10_1"], ["his-s11"], ["his-s12"], ["his-s13"], ["his-s14"], ["his-s15", "his-s15_1"]]}, {"id": "eco", "subject": "Economics", "title": "Chapter 7: Factors of Production", "short": "Ch 7 · Factors of Production", "emoji": "🏭", "c1": "#7b2cbf", "c2": "#3a0ca3", "summary": ["There are four factors of production: land, labour, capital and entrepreneurship.", "Land means natural resources like soil and water. Labour is human physical and mental effort.", "Capital means man-made tools, machinery and finance used in production. Entrepreneurship is the ability to organise the other three and take risks for profit.", "Entrepreneurs bring together land, labour and capital. Skilled labour (human capital) increases efficiency, and capital goods support labour.", "Human capital includes skills, knowledge and health. It raises productivity and quality, supports innovation and leads to economic growth.", "Human capital is built through education, vocational training, health care, and platforms like SWAYAM and National Career Service.", "Without skilled workers, businesses face low productivity, poor quality, delays, higher training costs, and loss of customers and profit."], "topics": [{"id": "e1", "title": "1. What are the Factors of Production?", "blocks": [{"p": "The factors of production include:", "a": ["e1-0"]}, {"ul": ["Land: Natural resource like soil and water.", "Labour: Human physical and mental effort.", "Capital: Man-made tools, machinery, finance used in production.", "Entrepreneurship: The ability to organise the other three and take risk for profit."], "a": [["e1-1"], ["e1-2"], ["e1-3"], ["e1-4"]]}]}, {"id": "e2", "title": "2. How do these factors relate and support each other?", "blocks": [{"p": "Entrepreneurs bring together land, labour, and capital to produce goods.", "a": ["e2-0"]}, {"p": "Skilled labour (human capital) increases worker efficiency, and capital goods support labour.", "a": ["e2-1"]}]}, {"id": "e3", "title": "3. What is the role of human capital in production, and what are its factors?", "blocks": [{"p": "Human capital includes skills, knowledge, and health, which enhances productivity.", "a": ["e3-0"]}, {"p": "These factors help in increasing efficiency and output quality, supporting innovation, leading to economic growth.", "a": ["e3-1"]}, {"p": "It is built through education and vocational training, health care, and platforms like SWAYAM and National Career Service.", "a": ["e3-2"]}]}, {"id": "e4", "title": "4. What problems could businesses face if they do not find workers with required skills?", "blocks": [{"p": "When businesses cannot find skilled workers, they face:", "a": ["e4-0"]}, {"ul": ["Low productivity.", "Poor quality products or services.", "Delays, increased training costs, loss of customers and profit."], "a": [["e4-1"], ["e4-2"], ["e4-3"]]}, {"p": "Skilled workers are essential for business growth and competition.", "a": ["e4-4"]}]}], "quiz": [{"topic": "e1", "type": "mcq", "q": "What are the four factors of production?", "a": "Land, labour, capital and entrepreneurship", "opts": ["Land, labour, capital and entrepreneurship", "Land, water, air and fire", "Money, gold, silver and shares", "Shops, markets, banks and schools"], "id": "eco-q0"}, {"topic": "e1", "type": "mcq", "q": "Soil and water are examples of ____.", "a": "Land", "opts": ["Land", "Labour", "Capital", "Entrepreneurship"], "id": "eco-q1"}, {"topic": "e1", "type": "mcq", "q": "Human physical and mental effort is called ____.", "a": "Labour", "opts": ["Labour", "Land", "Capital", "Entrepreneurship"], "id": "eco-q2"}, {"topic": "e1", "type": "mcq", "q": "Man-made tools, machinery and finance used in production are ____.", "a": "Capital", "opts": ["Capital", "Land", "Labour", "Entrepreneurship"], "id": "eco-q3"}, {"topic": "e1", "type": "mcq", "q": "The ability to organise the other three factors and take risk for profit is ____.", "a": "Entrepreneurship", "opts": ["Entrepreneurship", "Labour", "Capital", "Land"], "id": "eco-q4"}, {"topic": "e1", "type": "tf", "q": "Capital includes finance used in production.", "a": "True", "opts": ["True", "False"], "id": "eco-q5"}, {"topic": "e2", "type": "mcq", "q": "Who brings together land, labour and capital?", "a": "Entrepreneurs", "opts": ["Entrepreneurs", "Customers", "Tourists", "Students"], "id": "eco-q6"}, {"topic": "e2", "type": "tf", "q": "Capital goods support labour, and skilled labour increases worker efficiency.", "a": "True", "opts": ["True", "False"], "id": "eco-q7"}, {"topic": "e3", "type": "mcq", "q": "Human capital includes ____.", "a": "Skills, knowledge and health", "opts": ["Skills, knowledge and health", "Land and water", "Machines and tools", "Money and gold"], "id": "eco-q8"}, {"topic": "e3", "type": "mcq", "q": "Which platforms help build human capital (from your notes)?", "a": "SWAYAM and National Career Service", "opts": ["SWAYAM and National Career Service", "Hundi and Iqta", "Mansabdari and Jagir", "Kaveri and Panipat"], "id": "eco-
